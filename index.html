<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nonfon420 — Graph Gallery</title>
<style>
  :root{
    --bg:#0f1419; --panel:#171c24; --panel-2:#1e242e; --border:#2a323d;
    --text:#e6e9ee; --muted:#8b95a3; --accent:#4f9cf9; --accent-soft:#1d3a5f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden;
  }
  #sidebar{
    width:300px; flex:0 0 300px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; transition:margin-left .2s ease;
  }
  #sidebar .brand{ padding:18px 20px; border-bottom:1px solid var(--border); }
  #sidebar .brand h1{ font-size:16px; margin:0; letter-spacing:.3px; }
  #sidebar .brand p{ margin:4px 0 0; font-size:12px; color:var(--muted); }
  #nav{ overflow-y:auto; padding:8px 0; flex:1; }
  .group-header{
    display:flex; align-items:center; gap:8px; width:100%;
    background:none; border:0; cursor:pointer; text-align:left;
    padding:14px 20px 6px; font-size:11px; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted); font-weight:600; font-family:inherit;
  }
  .group-header:hover{ color:var(--text); }
  .caret{ display:inline-block; font-size:9px; transition:transform .2s ease; line-height:1; }
  .group.collapsed .caret{ transform:rotate(-90deg); }
  .group-items{ overflow:hidden; max-height:600px; transition:max-height .25s ease; }
  .group.collapsed .group-items{ max-height:0; }
  .nav-item{
    display:block; padding:9px 20px 9px 30px; color:var(--text); text-decoration:none;
    font-size:14px; border-left:3px solid transparent; cursor:pointer;
  }
  .nav-item:hover{ background:var(--panel-2); }
  .nav-item.active{ background:var(--accent-soft); border-left-color:var(--accent); color:#fff; }
  #main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #topbar{
    display:flex; align-items:center; gap:12px; padding:12px 18px;
    background:var(--panel); border-bottom:1px solid var(--border);
  }
  #menu-toggle{
    display:none; background:none; border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:6px 10px; cursor:pointer; font-size:16px; line-height:1;
  }
  #current-title{ font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #topbar .spacer{ flex:1; }
  #open-new{
    color:var(--accent); text-decoration:none; font-size:13px; white-space:nowrap;
    border:1px solid var(--border); padding:6px 12px; border-radius:6px;
  }
  #open-new:hover{ background:var(--panel-2); }
  #frame-wrap{ flex:1; position:relative; background:#fff; }
  #graph-frame{ width:100%; height:100%; border:0; display:block; }
  #loader{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--muted); font-size:14px; gap:10px;
  }
  #loader.hidden{ display:none; }
  .spinner{
    width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #backdrop{ display:none; }
  @media (max-width:760px){
    #sidebar{ position:fixed; z-index:30; height:100%; margin-left:-300px; }
    #sidebar.open{ margin-left:0; }
    #menu-toggle{ display:block; }
    #backdrop.show{ display:block; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:20; }
  }
</style>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <h1>Graph Gallery</h1>
      <p>mrnonfon0-bot / Nonfon420</p>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div id="backdrop"></div>
  <main id="main">
    <div id="topbar">
      <button id="menu-toggle" aria-label="Toggle menu">&#9776;</button>
      <span id="current-title">Select a graph</span>
      <span class="spacer"></span>
      <a id="open-new" href="#" target="_blank" rel="noopener">Open in new tab &#8599;</a>
    </div>
    <div id="frame-wrap">
      <div id="loader"><span class="spinner"></span> Loading&hellip;</div>
      <iframe id="graph-frame" title="Graph"></iframe>
    </div>
  </main>

<script>
  const GRAPHS = [
    { slug:"redistributive-policy",     file:"Welfare1.html",                                                 label:"Forms of “Redistributive” Policy", group:"Public Economics" },
    { slug:"regional-fed-zscores",      file:"regional_fed_avg_zscores_interactive.html",                     label:"Regional Fed Avg Z-Scores",     group:"Manufacturing Data" },
    { slug:"splinter-2020-taxes-are-progressive", file:"splinter-2020-taxes-are-progressive.html", label:"Splinter (2020) — Taxes are Progressive (comment)", group:"Effective Tax Rates" },
    { slug:"psz-2018",                           file:"psz-2018.html",                            label:"Piketty, Saez & Zucman (2018) — total US taxes",     group:"Effective Tax Rates" },
    { slug:"splinter-2019-who-pays-no-tax",      file:"splinter-2019-who-pays-no-tax.html",       label:"Splinter (2020) — Who pays no federal income tax?",  group:"Effective Tax Rates" },
    { slug:"splinter-2020-tax-progressivity",    file:"splinter-2020-tax-progressivity.html",     label:"Splinter (2020 NTJ) — Federal rates by quintile, 1979–2016", group:"Effective Tax Rates" },
    { slug:"itep-2024",                          file:"itep-2024.html",                           label:"ITEP (2024) — Federal + state & local taxes",        group:"Effective Tax Rates" },
    { slug:"top-etr",                            file:"top-etr.html",                             label:"IRS SOI — ETR by AGI percentile (2015, 2020)",       group:"Effective Tax Rates" },
    { slug:"americas-progressive-tax-transfer",  file:"americas-progressive-tax-transfer.html",   label:"Tax Foundation (2023) — Progressive tax + transfer system", group:"Effective Tax Rates" },
    { slug:"billionaire-tax-rate",               file:"billionaire-tax-rate.html",                label:"Splinter (2025) — Top 400 ETR (comment on BSYZ)",    group:"Effective Tax Rates" },
    { slug:"auten-splinter-2025-update",         file:"auten-splinter-2025-update.html",          label:"Auten-Splinter (2025) — Top 1% implicit ETR robustness", group:"Effective Tax Rates" },
    { slug:"cbo-2022",                           file:"cbo-2022.html",                            label:"CBO (2022) — Federal tax rates by income group, 1979–2022", group:"Effective Tax Rates" },
    { slug:"lls-2020-middle-class",              file:"lls-2020-middle-class.html",               label:"Looney-Larrimore-Splinter (2020) — Middle-class federal tax rate", group:"Effective Tax Rates" },
    { slug:"psz-income-shares",                  file:"psz-income-shares.html",                   label:"PSZ — Income shares 1913–2019",                      group:"Income Inequality" },
    { slug:"auten-splinter-top1-shares",         file:"auten-splinter-top1-shares.html",          label:"Auten-Splinter — Top 1% shares (3 measures) 1960–2022", group:"Income Inequality" },
    { slug:"psz-vs-as-top1-comparison",          file:"psz-vs-as-top1-comparison.html",           label:"PSZ vs Auten-Splinter — top 1% disagreement",        group:"Income Inequality" },
    { slug:"auten-splinter-gini",                file:"auten-splinter-gini.html",                 label:"Auten-Splinter — Gini coefficients (3 measures)",    group:"Income Inequality" },
    { slug:"psz-2018-income-growth",             file:"psz-2018-income-growth.html",              label:"PSZ — Income growth by group, post-war vs neoliberal", group:"Income Growth" },
    { slug:"realtime-inequality-income-shares", file:"realtime-inequality-income-shares.html", label:"RealTime Inequality — Income shares, pre vs post-tax (1976–2024)", group:"Income Inequality" },
    { slug:"wid-us-wealth-shares",              file:"wid-us-wealth-shares.html",              label:"WID — Net wealth shares: top 10% / 1% / bottom 50% (1979–2024)", group:"Wealth Inequality" },
    { slug:"realtime-inequality-wealth-shares", file:"realtime-inequality-wealth-shares.html", label:"RealTime Inequality — Wealth shares: top 10% / 1% / 0.1% (1976–2024)", group:"Wealth Inequality" },
  ];

  const STORAGE_KEY = 'nonfon420-collapsed-groups';
  const loadCollapsed = () => {
    try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
    catch(e){ return new Set(); }
  };
  const saveCollapsed = set => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch(e){}
  };
  const collapsedGroups = loadCollapsed();

  const encFile = f => f.split('/').map(encodeURIComponent).join('/');
  const navEl   = document.getElementById('nav');
  const frame   = document.getElementById('graph-frame');
  const loader  = document.getElementById('loader');
  const titleEl = document.getElementById('current-title');
  const openNew = document.getElementById('open-new');
  const sidebar = document.getElementById('sidebar');
  const backdrop= document.getElementById('backdrop');

  const linksBySlug = {};
  const groupElBySlug = {};

  // Preserve declaration order of groups
  const order = [];
  const groupsMap = {};
  GRAPHS.forEach(g => {
    if (!groupsMap[g.group]) { groupsMap[g.group] = []; order.push(g.group); }
    groupsMap[g.group].push(g);
  });

  order.forEach(name => {
    const groupEl = document.createElement('div');
    groupEl.className = 'group';
    const startCollapsed = collapsedGroups.has(name);
    if (startCollapsed) groupEl.classList.add('collapsed');

    const header = document.createElement('button');
    header.className = 'group-header';
    header.type = 'button';
    header.setAttribute('aria-expanded', String(!startCollapsed));
    const caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = '▾';
    const nameEl = document.createElement('span');
    nameEl.textContent = name;
    header.appendChild(caret);
    header.appendChild(nameEl);
    header.addEventListener('click', () => {
      const nowCollapsed = groupEl.classList.toggle('collapsed');
      header.setAttribute('aria-expanded', String(!nowCollapsed));
      if (nowCollapsed) collapsedGroups.add(name); else collapsedGroups.delete(name);
      saveCollapsed(collapsedGroups);
    });

    const itemsEl = document.createElement('div');
    itemsEl.className = 'group-items';
    groupsMap[name].forEach(g => {
      const a = document.createElement('a');
      a.className = 'nav-item';
      a.textContent = g.label;
      a.href = '#' + g.slug;
      itemsEl.appendChild(a);
      linksBySlug[g.slug] = a;
      groupElBySlug[g.slug] = groupEl;
    });

    groupEl.appendChild(header);
    groupEl.appendChild(itemsEl);
    navEl.appendChild(groupEl);
  });

  function closeSidebar(){ sidebar.classList.remove('open'); backdrop.classList.remove('show'); }

  function select(slug){
    const g = GRAPHS.find(x => x.slug === slug) || GRAPHS[0];
    Object.values(linksBySlug).forEach(a => a.classList.remove('active'));
    linksBySlug[g.slug].classList.add('active');
    // Reveal the active graph's group (visual only; doesn't change saved preference)
    const gEl = groupElBySlug[g.slug];
    if (gEl && gEl.classList.contains('collapsed')) {
      gEl.classList.remove('collapsed');
      gEl.querySelector('.group-header').setAttribute('aria-expanded', 'true');
    }
    titleEl.textContent = g.label;
    document.title = g.label + " — Nonfon420";
    const url = encFile(g.file);
    openNew.href = url;
    loader.classList.remove('hidden');
    if (frame.getAttribute('src') !== url) { frame.src = url; }
    else { loader.classList.add('hidden'); }
    closeSidebar();
  }

  frame.addEventListener('load', () => loader.classList.add('hidden'));

  const currentSlug = () => decodeURIComponent((location.hash || '').replace(/^#/, ''));
  window.addEventListener('hashchange', () => select(currentSlug()));

  document.getElementById('menu-toggle').addEventListener('click', () => {
    sidebar.classList.toggle('open');
    backdrop.classList.toggle('show');
  });
  backdrop.addEventListener('click', closeSidebar);

  select(currentSlug() || GRAPHS[0].slug);
</script>
</body>
</html>
